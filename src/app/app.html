<main class="desk">
	<section class="card">
		<h2>Aparência</h2>
		<div class="row"><span>Modo escuro</span><lx-form-control [control]="darkMode" label="Modo escuro" /></div>
		<div class="row"><span>Contraste</span><lx-form-control [control]="contrast" label="Contraste" /></div>
		@for (field of appearance.fields; track field.id) {
			<div class="row"><span>{{ field.definition.label }}</span><lx-form-control [control]="field.control" [label]="field.definition.label ?? field.id" /></div>
		}
	</section>

	<section class="card">
		<h2>Cadastro</h2>
		@for (field of profile.fields; track field.id) {
			<div class="row"><span>{{ field.definition.label }}</span><lx-form-control [control]="field.control" [label]="field.definition.label" /></div>
		}
		<code class="values">{{ values() }}</code>
		<div class="footer">
			<span class="hint">{{ invalid() ? 'Preencha os campos obrigatórios.' : 'Tudo certo.' }}</span>
			<button type="button" class="button" [disabled]="!dirty()" (click)="confirmReset.show()">Limpar</button>
		</div>
	</section>

	<lx-dialog [control]="confirmReset" title="Limpar o cadastro?" description="Os campos voltam aos valores iniciais.">
		<button type="button" class="button" (click)="confirmReset.hide()">Cancelar</button>
		<button type="button" class="button accent" (click)="resetProfile()">Limpar</button>
	</lx-dialog>
</main>
